# ****************************************************************
# Date: 12-10-2023
# Author: jchau
#
# Job description:
# 1. setup R
# 2. install R-package dependencies
# 3. build source R-package and upload as artifact
# 4. build binary R-package and upload as artifact
# ****************************************************************

name: build-binary-windows-workflow

on:
  workflow_call:
    inputs:
      rver:
        description: 'R-version used to execute job'
        required: true
        type: string
        default: 'release'
      build_source:
        description: 'Build/upload source version of R-package'
        required: true
        type: boolean
        default: false
      build_binary:
        description: 'Build/upload binary version of R-package'
        required: true
        type: boolean
        default: true

jobs:
  check-upload:
    runs-on: windows-latest
    name: windows-latest (R-${{ inputs.rver }})
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_VER: ${{ inputs.rver }}
    steps:
      - uses: actions/checkout@v4
      # - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.rver }}
          extra-repositories: 'https://mc-stan.org/r-packages/'
      - name: install BMABMDR dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            pkgbuild
            remotes
            rstantools
            roxygen2
      - name: set compiler flags
        run: |
          ## edit global Makevars.win
          dotR <- file.path(Sys.getenv("HOME"), ".R")
          if (!file.exists(dotR)) { dir.create(dotR) }
          MAKEVARS <- file.path(dotR, "Makevars.win")
          writeLines(c(
            "CXX17FLAGS += -Wno-unused-variable -Wno-unused-function -Wno-unknown-pragmas -Wno-ignored-attributes -Wno-deprecated -Wno-pedantic -ftemplate-backtrace-limit=1"
          ), MAKEVARS)
          cat("R_MAKEVARS_USER=", MAKEVARS, "\n", file = Sys.getenv("GITHUB_ENV"), sep = "", append = TRUE)
        shell: Rscript {0}

      - name: regenerate Stan exports and DLL export list
        run: |
          rstantools::rstan_config()
          Rcpp::compileAttributes()
          ## limit DLL exports (Windows allows at most 65535 symbols)
          files <- list.files("src", pattern = "^stanExports_.*\\.(h|cc)$", full.names = TRUE)
          mods <- unique(unlist(lapply(files, function(f) {
            l <- readLines(f, warn = FALSE)
            m <- regmatches(l, regexpr("RCPP_MODULE\\([A-Za-z0-9_]+\\)", l))
            sub("RCPP_MODULE\\((.*)\\)", "\\1", m)
          })))
          cat("number of Stan modules:", length(mods), "\n")
          writeLines(c("EXPORTS", "R_init_BMABMDR", paste0("_rcpp_module_boot_", mods)),
                     "src/BMABMDR-win.def")
        shell: Rscript {0}

      - name: update documentation (roxygen)
        run: |
          ok <- tryCatch({
            roxygen2::roxygenise(load_code = roxygen2::load_source)
            TRUE
          }, error = function(e) {
            message("load_source failed: ", conditionMessage(e))
            FALSE
          })
          ## fallback: full load (compiles the Stan models, slower)
          if (!ok) roxygen2::roxygenise()
        shell: Rscript {0}

      - name: build source R-package
        id: build-source
        run: |
          pkg <- pkgbuild::build()
          cat("name=", basename(pkg), "\n", "path=", file.path(pkg), "\n",
              file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)
          if (Sys.getenv("BUILD_SOURCE") == "true") {
            dir.create("pkg_source")
            file.copy(from = pkg, to = file.path("pkg_source", basename(pkg)))
          }
        shell: Rscript {0}
        env:
          BUILD_SOURCE: ${{ inputs.build_source }}

      - name: make artifact folder
        run: mkdir ${{ inputs.rver }}
        shell: cmd

      - name: upload source R-package
        if: inputs.build_source
        uses: actions/upload-artifact@v4
        with:
          name: src
          path: pkg_source
          if-no-files-found: ignore

      - name: build binary R-package
        id: build-binary
        if: inputs.build_binary
        run: pkgbuild::build(binary = TRUE, dest_path = Sys.getenv("R_VER"))
        shell: Rscript {0}

      - name: upload binary R-package
        if: success() && inputs.build_binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.rver }}
          path: ${{ inputs.rver }}
          if-no-files-found: error
